<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F5F0">
  <title>비움 — 버리는 손이, 돌려받는 손으로</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="비움">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage">
    <div class="device" id="device">
      <div class="statusbar" aria-hidden="true">
        <span class="num" id="clock">09:41</span>
        <span class="right"><span class="num">87%</span></span>
      </div>
      <main class="app" id="app"></main>
      <nav class="tabbar" id="tabbar" aria-label="주요 메뉴"></nav>
    </div>
  </div>
  <script src="data.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script>
    // 설치형 앱(PWA): http(s)로 열렸을 때만 서비스워커 등록. 파일로 열면 건너뜀.
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
